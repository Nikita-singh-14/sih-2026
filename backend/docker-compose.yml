services:
  postgres:
    image: postgres:16-alpine
    container_name: legal-metrology-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: legal_metrology
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - legal-metrology-postgres:/var/lib/postgresql/data

volumes:
  legal-metrology-postgres:
